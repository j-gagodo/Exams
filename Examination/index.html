    <script>
        // --- TEXTURE GENERATOR SYSTEM ---
        // Generates high-quality procedural textures for the Modern Villa
        AFRAME.registerSystem('texture-generator', {
            init: function() {
                this.generateTextures();
            },

            generateTextures: function() {
                const textures = {
                    'concrete': { method: 'drawConcrete', color: '#f5f5f5', noise: 10 }, // White Stucco
                    'concrete-dark': { method: 'drawConcrete', color: '#424242', noise: 15 }, // Dark Grey Feature
                    'wood-slats': { method: 'drawModernWood', color: '#8d6e63', highlight: '#a1887f' }, // Warm Timber
                    'marble': { method: 'drawMarble', color: '#ffffff', highlight: '#bdbdbd' }, // Polished Floor
                    'pavers': { method: 'drawPavers', color: '#e0e0e0', highlight: '#ffffff' }, // Driveway/Patio
                    'water': { method: 'drawWater', color: '#0288d1', highlight: '#81d4fa' },
                    'grass': { method: 'drawGrass', color: '#388e3c', highlight: '#4caf50' },
                    'sky': { method: 'drawSky', color: '#ffcc80', highlight: '#ff7043' }, // Sunset
                    'fabric': { method: 'drawFabric', color: '#eeeeee', highlight: '#bdbdbd' }, // Sofa
                    'pool-tiles': { method: 'drawPoolTiles', color: '#00bcd4', highlight: '#e0f7fa' }, // Pool specific tiles
                    'caustics': { method: 'drawCaustics', color: '#fff', highlight: '#81d4fa' }, // Refracted light pattern
                    'tiles': { method: 'drawPoolTiles', color: '#f5f5f5', highlight: '#ffffff' }, // Neutral Floor Tiles
                    'stone': { method: 'drawConcrete', color: '#333333', noise: 10 } // Granite Countertop
                };

                for (let id in textures) {
                    const canvas = document.createElement('canvas');
                    canvas.id = 'tex-' + id;
                    canvas.width = 1024;
                    canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    const params = textures[id];
                    
                    this[params.method](ctx, canvas.width, canvas.height, params);
                    
                    // Create asset item
                    const img = document.createElement('img');
                    img.id = id;
                    img.src = canvas.toDataURL();
                    document.querySelector('a-assets').appendChild(img);
                }

                setTimeout(() => {
                    const loader = document.getElementById('loading');
                    if (loader) {
                        loader.style.opacity = 0;
                        setTimeout(() => loader.remove(), 1000);
                    }
                }, 500);
            },

            drawConcrete: function(ctx, w, h, p) {
                ctx.fillStyle = p.color;
                ctx.fillRect(0, 0, w, h);
                // Enhanced Stucco Texture Noise
                for(let i=0; i<150000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#e0e0e0';
                    ctx.globalAlpha = 0.15; // Increased contrast for design visibility
                    ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
                }
            },

            drawModernWood: function(ctx, w, h, p) {
                ctx.fillStyle = p.color;
                ctx.fillRect(0, 0, w, h);
                // Horizontal slats
                const slatH = 64;
                const gap = 4;
                for(let y=0; y<h; y+=slatH) {
                    // Slat gradient
                    const grad = ctx.createLinearGradient(0, y, 0, y+slatH);
                    grad.addColorStop(0, p.color);
                    grad.addColorStop(1, p.highlight);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, y, w, slatH-gap);
                    
                    // Grain
                    for(let i=0; i<50; i++) {
                        ctx.strokeStyle = '#5d4037';
                        ctx.globalAlpha = 0.1;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, y + Math.random()*(slatH-gap));
                        ctx.lineTo(w, y + Math.random()*(slatH-gap));
                        ctx.stroke();
                    }
                    // Gap (dark)
                    ctx.fillStyle = '#1a1a1a';
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(0, y+slatH-gap, w, gap);
                }
            },

            drawMarble: function(ctx, w, h, p) {
                ctx.fillStyle = p.color;
                ctx.fillRect(0, 0, w, h);
                // Soft Veins
                for(let i=0; i<15; i++) {
                    ctx.strokeStyle = p.highlight;
                    ctx.globalAlpha = 0.2;
                    ctx.lineWidth = 10 + Math.random() * 20;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    let x = Math.random() * w;
                    let y = Math.random() * h;
                    ctx.moveTo(x, y);
                    for(let j=0; j<10; j++) {
                        x += Math.random() * 400 - 200;
                        y += Math.random() * 400 - 200;
                        ctx.quadraticCurveTo(x-50, y-50, x, y);
                    }
                    ctx.stroke();
                }
            },

            drawPavers: function(ctx, w, h, p) {
                ctx.fillStyle = '#9e9e9e'; // Grout
                ctx.fillRect(0, 0, w, h);
                const size = 128; // Large format
                const gap = 8;
                for(let x=0; x<w; x+=size) {
                    for(let y=0; y<h; y+=size*2) { // Running bond or just rectangular
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = 1;
                         // Slight color variation
                        if(Math.random() > 0.5) ctx.fillStyle = p.highlight;
                        
                        ctx.fillRect(x+gap, y+gap, size-gap*2, size*2-gap*2);
                        
                        // Noise on tile
                        ctx.fillStyle = '#000';
                        ctx.globalAlpha = 0.05;
                        ctx.fillRect(x+gap + Math.random()*50, y+gap + Math.random()*50, 20, 20);
                    }
                }
            },

            drawWater: function(ctx, w, h, p) {
                 ctx.fillStyle = p.color;
                 ctx.fillRect(0,0,w,h);
                 // Caustics
                 ctx.strokeStyle = p.highlight;
                 ctx.lineWidth = 5;
                 ctx.globalAlpha = 0.4;
                 for(let i=0; i<50; i++) {
                     let x = Math.random()*w;
                     let y = Math.random()*h;
                     let r = 20 + Math.random()*50;
                     ctx.beginPath();
                     ctx.arc(x, y, r, 0, Math.PI*2);
                     ctx.stroke();
                 }
            },

            drawGrass: function(ctx, w, h, p) {
               ctx.fillStyle = p.color;
               ctx.fillRect(0,0,w,h);
               ctx.fillStyle = p.highlight;
               ctx.globalAlpha = 0.1;
               for(let i=0; i<50000; i++) {
                   ctx.fillRect(Math.random()*w, Math.random()*h, 4, 4);
               }
            },

            drawSky: function(ctx, w, h, p) {
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#1a237e'); // Deep Twilight Blue
                grad.addColorStop(0.4, '#b39ddb'); // Purple/Lavender
                grad.addColorStop(0.7, '#ffcc80'); // Orange Sunset
                grad.addColorStop(1, '#ffab91'); // Warm horizon
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            },
            
            drawFabric: function(ctx, w, h, p) {
                ctx.fillStyle = p.color;
                ctx.fillRect(0,0,w,h);
                // Weave
                ctx.fillStyle = '#bdbdbd';
                ctx.globalAlpha = 0.1;
                 for(let i=0; i<w; i+=4) {
                     ctx.fillRect(i, 0, 1, h);
                     ctx.fillRect(0, i, w, 1);
                 }
            },

            drawPoolTiles: function(ctx, w, h, p) {
                ctx.fillStyle = '#006064'; // Grout (Dark Teal)
                ctx.fillRect(0,0,w,h);
                const size = 32; 
                const gap = 2;
                for(let x=0; x<w; x+=size) {
                    for(let y=0; y<h; y+=size) {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = 0.8 + Math.random()*0.2;
                        if(Math.random() > 0.8) ctx.fillStyle = p.highlight;
                        ctx.fillRect(x+gap, y+gap, size-gap*2, size-gap*2);
                    }
                }
            },

            drawCaustics: function(ctx, w, h, p) {
                ctx.fillStyle = '#000'; // Black background for additive blending
                ctx.fillRect(0,0,w,h);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.5;
                // Voronoi-ish cellular pattern approximation
                for(let i=0; i<100; i++) {
                    let x = Math.random()*w;
                    let y = Math.random()*h;
                    let r = 30 + Math.random()*100;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI*2);
                    ctx.stroke();
                }
                // Blur effect
                ctx.globalAlpha = 1;
                ctx.filter = 'blur(10px)';
                ctx.drawImage(ctx.canvas, 0, 0);
            }
        });

        // --- WATER ANIMATION & SHADER ---
        AFRAME.registerComponent('water-displacement', {
            schema: {
                speed: {type: 'number', default: 0.001},
                amplitude: {type: 'number', default: 0.05}
            },
            init: function () {
                this.time = 0;
                // We'll use a standard mesh but animate vertex positions for displacement effect
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.geometry = new THREE.PlaneGeometry(8, 6, 32, 32);
                }
            },
            tick: function (time, timeDelta) {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh) return;
                
                this.time += timeDelta * this.data.speed;
                const pos = mesh.geometry.attributes.position;
                
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    // Multi-layered sine waves for organic motion
                    const z = (Math.sin(x * 1.5 + this.time) * Math.cos(y * 1.5 + this.time) * this.data.amplitude) +
                              (Math.sin(x * 3.0 - this.time * 0.5) * 0.3 * this.data.amplitude) +
                              (Math.cos(y * 4.0 + this.time * 0.8) * 0.2 * this.data.amplitude);
                    pos.setZ(i, z);
                }
                pos.needsUpdate = true;

                // Also scroll texture more aggressively for "in motion" look
                if (mesh.material.map) {
                    mesh.material.map.offset.y += 0.0002 * timeDelta;
                    mesh.material.map.offset.x += 0.0001 * timeDelta;
                }
            }
        });

        // --- CAUSTIC MOTION ---
        AFRAME.registerComponent('caustic-motion', {
            tick: function (time, timeDelta) {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh || !mesh.material.map) return;
                mesh.material.map.offset.y -= 0.0001 * timeDelta;
                mesh.material.map.offset.x -= 0.00008 * timeDelta;
            }
        });
        
        // --- SIMPLE COLLIDER / MOVEMENT RESTRICTION ---
        // Keeps player within bounds (simple implementation: stick to generic floor height and limit X/Z)
        AFRAME.registerComponent('simple-nav', {
            init: function() {
                this.camera = this.el.querySelector('[camera]');
            },
            tick: function() {
                if (!this.camera) return;
                
                const camPos = this.camera.getAttribute('position');
                const rigPos = this.el.getAttribute('position');
                
                // Transfer horizontal movement from camera (wasd) to rig
                if (Math.abs(camPos.x) > 0.001 || Math.abs(camPos.z) > 0.001) {
                    rigPos.x += camPos.x;
                    rigPos.z += camPos.z;
                    this.el.setAttribute('position', rigPos);
                    
                    // Reset camera to center of rig
                    this.camera.setAttribute('position', {x: 0, y: 0, z: 0});
                }

                // Simple floor clamping & height maintenance
                if (rigPos.y < 1.6) {
                    rigPos.y = 1.6;
                    this.el.setAttribute('position', rigPos);
                }
            }
        });

        // --- MODEL COLOR TINT ---
        AFRAME.registerComponent('model-color', {
            schema: {type: 'color', default: '#fff'},
            init: function() {
                this.applyColor = this.applyColor.bind(this);
                this.el.addEventListener('model-loaded', this.applyColor);
            },
            applyColor: function() {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh) return;
                const color = new THREE.Color(this.data);
                mesh.traverse((node) => {
                    if (node.isMesh) {
                        // Clone material to avoid affecting other instances
                        if (Array.isArray(node.material)) {
                            node.material = node.material.map(m => {
                                const newMat = m.clone();
                                newMat.color.set(color);
                                return newMat;
                            });
                        } else {
                            node.material = node.material.clone();
                            node.material.color.set(color);
                        }
                    }
                });
            }
        });

    </script>

        <a-entity light="type: directional; color: #ffd54f; intensity: 1.1; castShadow: true; shadowMapHeight: 2048; shadowMapWidth: 2048" position="-8 6 8"></a-entity>
        <!-- Ambient (Softer) -->
        <a-entity light="type: hemisphere; color: #fff8e1; groundColor: #5d4037; intensity: 0.5"></a-entity>
        
        <!-- --- PLAYER --- -->
        <a-entity id="rig" position="0 1.6 25" simple-nav>
            <a-entity camera look-controls wasd-controls="acceleration: 20" position="0 0 0">
                <a-cursor color="white" scale="0.5 0.5 0.5" raycaster="objects: .clickable"></a-cursor>
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
